name: CI

# Verify the SDK builds against the pinned contracts on every push / PR.
# Regenerates generated.ts from logswap-contract @ contracts.ref, typechecks, builds, and runs the
# derivation vectors. This is the ANTI-DRIFT GATE: if a contract change breaks the SDK, tsc fails
# here rather than at runtime in somebody's app.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # Short-lived token from the org GitHub App to read the private contracts repo. The App must
      # be installed on unimodularxyz/logswap-contract for this to resolve.
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          # The App's CLIENT ID, which GitHub now prefers over the numeric App ID as the JWT
          # issuer. Public metadata, not a credential — the private key is what signs, and it is
          # the only secret this workflow needs. App: unimodular-ci.
          app-id: Iv23liQW3rA6qn9mG00J
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: unimodularxyz
          repositories: logswap-contract
      - name: Configure contracts clone URL (codegen clones logswap-contract via the App token)
        run: echo "CONTRACTS_REPO=https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/unimodularxyz/logswap-contract.git" >> "$GITHUB_ENV"

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1 — old pin predated foundryup's binary installer and died with 'cannot execute binary file'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - run: npm ci

      # Codegen ONCE, explicitly. typecheck and build both consume src/generated.ts and neither
      # produces it, so ordering matters: tsc without it fails on a missing module.
      - run: npm run codegen
      - run: npm run typecheck
      - run: npm run build

      # Stand up a node with the local deployment so the INTEGRATION reads actually run. The fork
      # test this pattern replaces was skipped in CI and therefore guarded nothing; LOGSWAP_REQUIRE_NODE
      # makes a missing node a hard failure rather than a silent skip.
      - name: Deploy to anvil
        run: |
          anvil --silent &
          for i in $(seq 1 30); do cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break; sleep 1; done
          (cd contracts && ./script/local-deploy.sh)

      # The cross-implementation check: the TypeScript must reproduce the Solidity's poolId and
      # position-id derivations exactly. Both are tier-1 frozen, and getting them wrong is silent.
      - name: Test (unit + integration)
        env:
          LOGSWAP_REQUIRE_NODE: "1"
          LOGSWAP_DEPLOYMENT: contracts/deployments/local.json
        run: npm test

      # A diff here means the DERIVATION moved, which is by definition a tier-1 event — never an
      # incidental one. Fail loudly rather than quietly regenerating.
      - name: Vectors must match the pinned contracts
        run: |
          npm run vectors
          git diff --exit-code -- vectors/ || {
            echo "::error::derivation vectors changed — poolId or the position-id packing moved."
            exit 1
          }
